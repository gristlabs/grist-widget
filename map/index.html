<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.6.0/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.6.0/dist/leaflet-src.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="screen.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <!-- next line is optional - only if geocoding is desired -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet-control-geocoder@3.1.0/dist/Control.Geocoder.js"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.3/dist/purify.min.js"></script>
    <script src="page.js"></script>
  </head>
  <body>
    <div id="map">
    </div>
    <div id="settings">
      <div id="btnClose">Close</div>
      <label id="lblToggle" for="cbxMode">
        <input type="checkbox" id="cbxMode">
        <span id="lblText">All locations</span>
      </label>
      <br/>
      <table>
        <tr>
          <td> <label id="lblSource" for="mapSource"> Source </label> </td>
          <td> <input id="mapSource"> </td>
        </tr>
        <tr>
          <td> <label id="lblCopyright" for="mapCopyright"> Copyright </label> </td>
          <td> <input id="mapCopyright"> </td>
        </tr>
        <!-- Default view -->
        <tr><td colspan="2"><b>Default view</b> (empty = fit all pins)</td></tr>
        <tr>
          <td> <label for="defaultLat"> Latitude </label> </td>
          <td> <input id="defaultLat" type="number" step="any" min="-90" max="90"> </td>
        </tr>
        <tr>
          <td> <label for="defaultLng"> Longitude </label> </td>
          <td> <input id="defaultLng" type="number" step="any" min="-180" max="180"> </td>
        </tr>
        <tr>
          <td> <label for="defaultZoom"> Zoom (1-18) </label> </td>
          <td> <input id="defaultZoom" type="number" step="1" min="1" max="18"> </td>
        </tr>
        <tr>
          <td colspan="2">
            <button id="btnUseView" type="button">Use current view</button>
            <button id="btnClearView" type="button">Clear</button>
            <div id="viewMsg"></div>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
